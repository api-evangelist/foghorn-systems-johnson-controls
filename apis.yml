name: FogHorn Systems (Johnson Controls)
description: 'FogHorn Systems was a Sunnyvale, California developer of edge AI and machine
  learning software for the industrial and commercial Internet of Things (IIoT). Its Lightning
  Edge AI platform and Lightning EdgeML brought real-time streaming analytics and ML inference
  to constrained on-premises edge hardware for predictive maintenance, machine optimization,
  and operational intelligence use cases. Johnson Controls acquired FogHorn in January 2022 and
  folded its team and technology into the OpenBlue suite of smart, autonomous building solutions,
  with the former Sunnyvale headquarters operating as a Johnson Controls "AI Hub." FogHorn no
  longer operates as a standalone brand and publishes no independent public developer surface —
  no developer portal, API reference, SDKs, or GitHub organization resolve as of this enrichment
  pass; the former foghorn.io/foghorn.ai domains are parked. This profile is retained as a
  network company record with no public API artifacts to harvest.'
